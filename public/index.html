<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontline Hub</title>
  <meta name="description" content="Frontline Hub: the internal Sales, Support and CS workspace that works through HubSpot, Intercom, Jira, Slack, Snowflake and Claude." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230F5C3A%22/%3E%3Ctext x=%2216%22 y=%2222.5%22 font-size=%2219%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22%23FFFFFF%22 text-anchor=%22middle%22%3EF%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('frontline-hub-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Icon set: 24px stroke icons, referenced with <svg><use href="#i-name"/></svg> -->
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l2.5-7.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></symbol>
      <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15.5" r="1.2"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M3 12h4l2-4 3 8 2-4h7"/><path d="M12 21s-8-4.5-9.5-10"/><path d="M21.5 11C20 16.5 12 21 12 21"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M13.5 7.5l3 3M4 20h16"/></symbol>
      <symbol id="i-trend-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></symbol>
      <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 3c3.5 2 5.5 5.5 5 10l-2.5 3h-5L7 13c-.5-4.5 1.5-8 5-10z"/><circle cx="12" cy="9.5" r="1.8"/><path d="M9.5 16l-2 4 3-1.5M14.5 16l2 4-3-1.5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home" aria-label="Frontline Hub home">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span class="brand-name">Frontline <b>Hub</b></span>
      </a>

      <button class="search-btn" id="search-btn" type="button" aria-label="Search (Ctrl+K)">
        <svg class="ico"><use href="#i-search"/></svg><span>Search…</span><kbd id="kbd-k">Ctrl K</kbd>
      </button>

      <nav class="nav" aria-label="Main">
        <a href="#/home" data-nav="home"><svg class="ico"><use href="#i-sun"/></svg>Good morning</a>
        <a href="#/accounts" data-nav="accounts"><svg class="ico"><use href="#i-building"/></svg>Accounts</a>
        <div class="nav-label">Sales</div>
        <a href="#/pipeline" data-nav="pipeline"><svg class="ico"><use href="#i-board"/></svg>Pipeline</a>
        <a href="#/approvals" data-nav="approvals"><svg class="ico"><use href="#i-check"/></svg>Approvals<span class="badge" id="badge-approvals" hidden></span></a>
        <div class="nav-label">Support</div>
        <a href="#/inbox" data-nav="inbox"><svg class="ico"><use href="#i-inbox"/></svg>Inbox<span class="badge" id="badge-inbox" hidden></span></a>
        <div class="nav-label">Customer Success</div>
        <a href="#/portfolio" data-nav="portfolio"><svg class="ico"><use href="#i-heart"/></svg>My portfolio<span class="badge" id="badge-portfolio" hidden></span></a>
        <a href="#/onboarding" data-nav="onboarding"><svg class="ico"><use href="#i-flag"/></svg>Onboarding</a>
        <a href="#/requests" data-nav="requests"><svg class="ico"><use href="#i-bulb"/></svg>Feature requests</a>
        <div class="nav-label">System</div>
        <a href="#/ops" data-nav="ops"><svg class="ico"><use href="#i-gauge"/></svg>Ops center<span class="badge" id="badge-ops" hidden></span></a>
        <a href="#/log" data-nav="log"><svg class="ico"><use href="#i-activity"/></svg>Activity log</a>
        <a href="#/connections" data-nav="connections"><svg class="ico"><use href="#i-plug"/></svg>Connections</a>
      </nav>

      <div class="sidebar-foot">
        <!-- Holds the signed-in demo user; the menu below drives it. -->
        <select id="user" class="sr-only" tabindex="-1" aria-hidden="true"></select>
        <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="user-text"><span id="user-name"></span><span class="muted xs" id="user-role"></span></span>
          <svg class="ico chev"><use href="#i-chevron"/></svg>
        </button>
        <div class="menu" id="user-menu" role="menu" hidden></div>
      </div>
    </aside>

    <main id="view" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <dialog id="drawer" class="drawer" aria-label="Account snapshot"></dialog>
  <dialog id="palette" class="palette" aria-label="Search"></dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
